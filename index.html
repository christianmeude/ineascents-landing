<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inea Scents - Bespoke Perfume Bar for Your Event</title>
    <meta name="description" content="Inea Scents sets up a styled perfume bar at events in Metro Manila. Guests choose from 4 inspired scents and take home a 10ml bottle with your logo. Starts at Php 4,499." />
    <meta name="theme-color" content="#fdf4f5" />
    <script>
      try {
        if (
          localStorage.getItem('inea-theme') === 'dark' ||
          (!localStorage.getItem('inea-theme') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Inea Scents - Bespoke Perfume Bar" />
